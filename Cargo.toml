[package]
name = "claude-statusline"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "A fast Rust binary that reads Claude Code JSON from stdin and writes a formatted ANSI statusline to stdout"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
